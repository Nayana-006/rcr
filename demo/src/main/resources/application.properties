spring.application.name=demo

# Temporary in-memory DB for local dev
spring.datasource.url=jdbc:h2:mem:rcdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=ChangeThisSecretKeyForJwtSigning_ChangeThisSecretKeyForJwtSigning
app.jwt.expirationMillis=3600000

# For security/JWT endpoints
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

