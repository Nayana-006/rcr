spring.application.name=demo

# MySQL configuration (default)
spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=ChangeThisSecretKeyForJwtSigning_ChangeThisSecretKeyForJwtSigning
app.jwt.expirationMillis=3600000

# For security/JWT endpoints
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# H2 Console (disabled by default, enable with -Dspring.profiles.active=h2)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console